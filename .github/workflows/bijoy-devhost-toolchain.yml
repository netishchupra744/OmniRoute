name: Bijoy DevHost Windows Compatibility Runtime

on:
  push:
    branches:
      - tooling/bijoy-devhost-sdk
  pull_request:
    branches:
      - release/v3.8.50
    paths:
      - .github/workflows/bijoy-devhost-toolchain.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-wine-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify Wine WOW64 runtime
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/wine-11.14-amd64-wow64.tar.xz"
          curl --fail --silent --show-error --location \
            https://github.com/Kron4ek/Wine-Builds/releases/download/11.14/wine-11.14-amd64-wow64.tar.xz \
            --output "$file"
          echo "707956fa1574ad1660c4d7f2cfd9c024e0f437ad0a2d501a53b717adb1288222  $file" | sha256sum --check --strict
          ls -lh "$file"

      - name: Upload verified compatibility runtime
        uses: actions/upload-artifact@v4
        with:
          name: bijoy-wine-11.14-amd64-wow64
          path: ${{ runner.temp }}/wine-11.14-amd64-wow64.tar.xz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
